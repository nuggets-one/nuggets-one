<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <radialGradient id="slateGlow" cx="20%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <radialGradient id="yellowAccent" cx="85%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#facc15" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#slateGlow)" />
  <rect width="1024" height="500" fill="url(#yellowAccent)" />

  <g transform="translate(120, 250)">
    <rect x="0" y="-80" width="120" height="120" rx="24" fill="#facc15" />
    <g transform="translate(60, -20) scale(0.235) translate(-256, -256)">
      <path d="M 140 110 L 210 110 L 302 340 V 110 H 372 V 402 H 302 L 210 172 V 402 H 140 Z" fill="#111827" />
    </g>
    <text x="150" y="-25" font-family="sans-serif" font-weight="700" font-size="54" fill="#ffffff" letter-spacing="-0.03em">Nuggets</text>
    <text x="150" y="25" font-family="sans-serif" font-weight="700" font-size="20" fill="#facc15" letter-spacing="0.08em">THE KNOWLEDGE APP</text>
    <text x="150" y="55" font-family="sans-serif" font-weight="400" font-size="14" fill="#94a3b8">Distilling high-signal intelligence into digestible insights.</text>
  </g>

  <g transform="translate(680, 250)">
    <circle cx="0" cy="0" r="160" fill="#facc15" opacity="0.05" />
    <rect x="-140" y="-120" width="280" height="180" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" transform="rotate(-6)" />
    <rect x="-120" y="-100" width="80" height="12" rx="4" fill="#facc15" fill-opacity="0.2" transform="rotate(-6)"/>
    <rect x="-120" y="-80" width="200" height="8" rx="2" fill="#475569" transform="rotate(-6)"/>
    <rect x="-120" y="-65" width="160" height="8" rx="2" fill="#475569" transform="rotate(-6)"/>
    <g transform="rotate(4) translate(10, -20)">
      <rect x="-130" y="-90" width="260" height="170" rx="16" fill="#ffffff" filter="drop-shadow(0 20px 13px rgb(0 0 0 / 0.3))" />
      <rect x="-110" y="-70" width="75" height="18" rx="9" fill="#fef08a" />
      <text x="-72.5" y="-61" font-family="sans-serif" font-weight="700" font-size="9" fill="#854d0e" text-anchor="middle" dominant-baseline="middle">PHILOSOPHY</text>
      <text x="-110" y="-35" font-family="sans-serif" font-weight="700" font-size="12" fill="#0f172a">"The impediment to action</text>
      <text x="-110" y="-18" font-family="sans-serif" font-weight="700" font-size="12" fill="#0f172a">advances action. What stands</text>
      <text x="-110" y="-1" font-family="sans-serif" font-weight="700" font-size="12" fill="#0f172a">in the way becomes the way."</text>
      <text x="-110" y="24" font-family="sans-serif" font-weight="400" font-size="9" fill="#64748b">— Marcus Aurelius, Meditations</text>
      <polygon points="110,-65 113,-59 119,-59 114,-55 116,-49 110,-53 104,-49 106,-55 101,-59 107,-59" fill="#facc15" />
    </g>
  </g>
</svg>

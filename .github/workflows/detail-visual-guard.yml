name: Detail Visual Guard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "components/ui/sheet.tsx"
      - "components/ui/article-content.tsx"
      - "components/ui/article-body.tsx"
      - "components/ui/timestamp-link-interceptor.tsx"
      - "lib/ui/youtube-hero-scroll.ts"
      - "docs/ARTICLE_DETAIL_DRAWER_UI_SPEC.md"

jobs:
  detail-visual-regression:
    if: ${{ vars.DETAIL_VISUAL_GUARD == 'true' && vars.DETAIL_VISUAL_YOUTUBE_URL != '' && vars.DETAIL_VISUAL_IMAGE_URL != '' && vars.DETAIL_VISUAL_FALLBACK_URL != '' && vars.DETAIL_VISUAL_LONG_URL != '' }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build env vars are configured
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "Missing NEXT_PUBLIC_SUPABASE_URL or NEXT_PUBLIC_SUPABASE_ANON_KEY."
            echo "Configure repo vars/secrets: NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY."
            exit 1
          fi

      - name: Build app
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run detail visual contract tests
        env:
          DETAIL_VISUAL_YOUTUBE_URL: ${{ vars.DETAIL_VISUAL_YOUTUBE_URL }}
          DETAIL_VISUAL_IMAGE_URL: ${{ vars.DETAIL_VISUAL_IMAGE_URL }}
          DETAIL_VISUAL_FALLBACK_URL: ${{ vars.DETAIL_VISUAL_FALLBACK_URL }}
          DETAIL_VISUAL_LONG_URL: ${{ vars.DETAIL_VISUAL_LONG_URL }}
        run: npm run test:detail-visual

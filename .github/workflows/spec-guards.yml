name: Spec Guards
on: [push, pull_request]
jobs:
  grep-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ETL workspace dependencies
        run: npm --prefix scripts/migrate ci

      - name: No is_published in app code
        run: |
          ! grep -rE "\bis_published\b" app/ components/ lib/ \
            --include="*.ts" --include="*.tsx" \
            | grep -v "lib/queries/collections.ts"

      - name: No framer-motion
        run: |
          ! grep -rE "from ['\"]framer-motion['\"]" \
            --include="*.ts" --include="*.tsx" \
            app/ components/ lib/

      - name: No rehype-raw
        run: |
          ! grep -rE "rehype-raw" \
            --include="*.ts" --include="*.tsx" \
            app/ components/ lib/

      - name: No service_role outside admin client and env validation
        run: |
          ! grep -rE "SUPABASE_SERVICE_ROLE_KEY" \
            --include="*.ts" --include="*.tsx" \
            app/ components/ lib/ \
            | grep -v "lib/supabase/admin.ts" \
            | grep -v "lib/env.ts"

      - name: No banned packages in dependencies
        run: |
          node -e "
            const pkg = require('./package.json');
            const banned = [
              'framer-motion','mongoose','express',
              '@tanstack/react-query','@tanstack/react-virtual',
              'react-router-dom','redux','zustand','jotai','recoil',
              'mobx','valtio','xstate','moment','date-fns','dayjs',
              'luxon','styled-components','@emotion/styled','stitches',
              'react-youtube','react-player','slugify','bullmq','redis',
              'web-push','react-modal','react-spring','auto-animate',
              '@vercel/og'
            ];
            const all = {
              ...pkg.dependencies,
              ...pkg.devDependencies
            };
            const found = banned.filter(b => all[b]);
            if (found.length) {
              console.error('BANNED PACKAGES FOUND:', found);
              process.exit(1);
            }
            console.log('Package check passed — no banned packages found.');
          "

      - name: Audit S2-F7 banned import check
        run: npm run check:banned-imports

      - name: Build app for budget checks
        run: npm run build

      - name: Audit S2-F3 bundle budget check
        run: npm run check:bundle-budget
